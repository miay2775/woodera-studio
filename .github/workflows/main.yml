name: Sync Beget DNS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dns/**'

permissions:
  contents: read
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync WOODERA DNS in Beget
        env:
          BEGET_LOGIN: ${{ secrets.BEGET_LOGIN }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
        run: python3 dns/sync_beget.py

      - name: Check GitHub Pages and request HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/pages'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2026-03-10',
              'User-Agent': 'WOODERA-Pages-Bridge/1.0',
          }

          def request(method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read().decode('utf-8')
                      return r.status, body
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', errors='replace')

          status, body = request()
          print(f'Pages status HTTP {status}')
          if status == 200:
              info = json.loads(body)
              print('cname:', info.get('cname'))
              print('https_enforced:', info.get('https_enforced'))
              print('status:', info.get('status'))
              if info.get('https_enforced'):
                  print('SUCCESS: HTTPS is already enforced')
                  raise SystemExit(0)

          status, body = request('PUT', {'https_enforced': True})
          if status == 204:
              print('SUCCESS: HTTPS enforcement enabled')
          else:
              print(f'HTTPS not enabled yet; GitHub returned HTTP {status}: {body[:500]}')
              print('DNS may still be propagating or the workflow token may lack repository administration permission.')
          PY
